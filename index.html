<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlexScape • Home Portal</title>
  <meta name="description"
    content="FlexScape - Next-Gen Motion Flow & Study Wellness. Choose between FlexScape Room (Vision AI Game) or FlexScape Mobile Web Companion.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Zen+Dots&display=swap"
    rel="stylesheet">

  <style>
    /* ==========================================================================
       Design System & Variables
       ========================================================================== */
    :root {
      --primary-cyan: #30DFF2;
      --primary-lime: #C7FD05;
      --primary-pink: #FF3FAB;
      --primary-teal: #2C735F;
      --cream-light: #FFF4ED;

      --bg-dark: #070B12;
      --bg-surface: #0E1626;
      --bg-card: rgba(16, 26, 46, 0.75);
      --bg-card-hover: rgba(22, 36, 64, 0.9);

      --border-glass: rgba(255, 255, 255, 0.12);
      --border-cyan: rgba(48, 223, 242, 0.4);
      --border-lime: rgba(199, 253, 5, 0.4);

      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --text-dim: #64748B;

      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 32px;
      --radius-pill: 9999px;

      --font-display: 'Outfit', sans-serif;
      --font-digital: 'Zen Dots', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 40px 20px;
    }

    /* Ambient Animated Mesh Background */
    .ambient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.28;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--primary-cyan), transparent);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--primary-lime), transparent);
      bottom: -80px;
      right: -80px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--primary-pink), transparent);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.16;
      animation-delay: -8s;
    }

    @keyframes floatOrb {
      0% {
        transform: translateY(0) scale(1);
      }

      100% {
        transform: translateY(50px) scale(1.15);
      }
    }

    /* Background Cyber Grid */
    .cyber-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
    }

    /* Main Container */
    .portal-main-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Brand Header */
    .brand-hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 48px;
    }

    .brand-logo-container {
      width: 96px;
      height: 112px;
      margin-bottom: 20px;
      filter: drop-shadow(0 12px 28px rgba(48, 223, 242, 0.4));
      animation: gentleFloat 5s ease-in-out infinite;
    }

    @keyframes gentleFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #FFFFFF 30%, var(--primary-cyan) 70%, var(--primary-lime) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .brand-subtitle-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(48, 223, 242, 0.1);
      border: 1px solid var(--border-cyan);
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-cyan);
      margin-bottom: 16px;
    }

    .brand-description {
      max-width: 580px;
      font-size: 17px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    /* Cards Grid */
    .experience-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      width: 100%;
      margin-bottom: 48px;
    }

    @media (max-width: 820px) {
      .experience-cards-grid {
        grid-template-columns: 1fr;
        max-width: 520px;
      }

      .brand-title {
        font-size: 42px;
      }
    }

    /* Experience Card */
    .experience-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 44px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      backdrop-filter: blur(20px);
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      min-height: 220px;
    }

    .experience-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--card-accent), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .experience-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-8px) scale(1.015);
      border-color: var(--card-accent);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45), 0 0 30px var(--card-glow);
    }

    .experience-card:hover::before {
      opacity: 1;
    }

    /* Room Theme Accent */
    .card-room {
      --card-accent: #30DFF2;
      --card-glow: rgba(48, 223, 242, 0.25);
    }

    /* Mobile Theme Accent */
    .card-mobile {
      --card-accent: #C7FD05;
      --card-glow: rgba(199, 253, 5, 0.25);
    }

    .card-top-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--card-accent);
    }

    .card-icon-emblem {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      margin-bottom: 20px;
      transition: transform 0.3s ease;
    }

    .experience-card:hover .card-icon-emblem {
      transform: scale(1.1) rotate(4deg);
      border-color: var(--card-accent);
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 12px;
    }

    .card-desc {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 24px;
      flex-grow: 1;
    }

    /* Tags Row */
    .card-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .card-pill-tag {
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 12px;
      color: #E2E8F0;
      font-weight: 500;
    }

    /* Action Button inside Card */
    .card-action-btn {
      width: 100%;
      height: 52px;
      background: var(--card-accent);
      color: #070B12;
      border: none;
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .experience-card:hover .card-action-btn {
      box-shadow: 0 8px 20px var(--card-glow);
      transform: translateY(-2px);
    }

    /* Footer Key Hint */
    .portal-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .key-badge {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-glass);
      border-radius: 6px;
      font-family: var(--font-digital);
      font-size: 11px;
      color: #FFFFFF;
    }
  </style>
</head>

<body>

  <!-- Background Orbs -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>
  <div class="cyber-grid"></div>

  <!-- Main Portal Section -->
  <main class="portal-main-wrapper">

    <!-- Hero Brand Header -->
    <header class="brand-hero-section">
      <div class="brand-logo-container">
        <img src="logo.svg" alt="FlexScape Logo" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 25px rgba(48, 223, 242, 0.45));">
      </div>
      <h1 class="brand-title">FlexScape</h1>
    </header>

    <!-- 2 Main Interactive Experience Cards -->
    <section class="experience-cards-grid">

      <!-- Card 1: FlexScape Room -->
      <a href="room.html" class="experience-card card-room" id="card-room"
        title="Launch FlexScape Room">
        <h2 class="card-title">FlexScape Room</h2>
        <div class="card-action-btn">
          <span>Enter Game Room</span>
          <span>➔</span>
        </div>
      </a>

      <!-- Card 2: FlexScape Reminder Device Companion -->
      <a href="mobile.html" class="experience-card card-mobile" id="card-mobile"
        title="Launch FlexScape Reminder Device">
        <h2 class="card-title">FlexScape Reminder Device</h2>
        <div class="card-action-btn">
          <span>Open Reminder Device</span>
          <span>➔</span>
        </div>
      </a>

    </section>

    <!-- Footer Shortcuts -->
    <footer class="portal-footer">
      <span>Press <span class="key-badge">1</span> for Game Room</span>
      <span>•</span>
      <span>Press <span class="key-badge">2</span> for Reminder Device</span>
    </footer>

  </main>

  <script>
    // Lightweight Haptic Feedback for Mobile
    function triggerCardHaptic() {
      if (typeof navigator !== "undefined" && navigator.vibrate) {
        try { navigator.vibrate(25); } catch(e) {}
      }
    }
    document.querySelectorAll(".experience-card").forEach(card => {
      card.addEventListener("click", triggerCardHaptic);
    });

    // Keyboard Navigation Shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.key === "1") {
        triggerCardHaptic();
        window.location.href = "room.html";
      } else if (e.key === "2") {
        triggerCardHaptic();
        window.location.href = "mobile.html";
      }
    });
  </script>

</body>

</html>
